{id:'friends',cn:'我有唔少朋友',py:'ngo5 jau5 m4 siu2 pang4 jau5',ja:'私には結構たくさんの友達がいる。',context:'友達の話に広げる。',bits:[['我','ngo5','私'],['有','jau5','いる・持っている'],['唔少','m4 siu2','少なくない・結構多い'],['朋友','pang4 jau5','友達']],q:'「唔少朋友」はどんな意味？',opts:['友達が少ない','結構多くの友達','幼なじみ'],a:1,note:'唔（m4）は否定。唔少で「少なくない」。'},
{id:'travel',cn:'佢哋成日去日本旅行',py:'keoi5 dei6 seng4 jat6 heoi3 jat6 bun2 leoi5 hang4',ja:'彼らはよく日本に旅行する。',context:'友達の日本旅行について話す。',bits:[['佢哋','keoi5 dei6','彼ら'],['成日','seng4 jat6','よく・頻繁に'],['去日本','heoi3 jat6 bun2','日本へ行く'],['旅行','leoi5 hang4','旅行する']],q:'「成日」の意味に一番近いのは？',opts:['頻繁に','初めて','来年'],a:0,note:'成日（seng4 jat6）は日常会話で「しょっちゅう・よく」。'},
{id:'tokyo',cn:'佢哋唔單止去東京',py:'keoi5 dei6 m4 daan1 zi2 heoi3 dung1 ging1',ja:'彼らは東京だけに行くわけではない。',context:'東京以外にも行くことを伝える。',bits:[['佢哋','keoi5 dei6','彼ら'],['唔單止','m4 daan1 zi2','〜だけではない'],['去','heoi3','行く'],['東京','dung1 ging1','東京']],q:'「唔單止」はどんな意味？',opts:['もう行かない','〜だけではない','〜しか知らない'],a:1,note:'唔單止〜は、続けて別のものを挙げる時に便利。'},
{id:'places',cn:'仲會去九州同北海道',py:'zung6 wui5 heoi3 gau2 zau1 tung4 bak1 hoi2 dou6',ja:'九州や北海道にも行く。',context:'行き先を付け加える。',bits:[['仲會','zung6 wui5','さらに〜もする'],['去','heoi3','行く'],['九州','gau2 zau1','九州'],['同','tung4','〜と・そして'],['北海道','bak1 hoi2 dou6','北海道']],q:'「同」はこの文では何の役割？',opts:['場所を否定する','九州と北海道をつなぐ','回数を表す'],a:1,note:'同（tung4）は会話で「〜と」を表す。'},

{id:'wish',cn:'我都想去北海道',py:'ngo5 dou1 soeng2 heoi3 bak1 hoi2 dou6',ja:'私も北海道に行きたい。',context:'相手の旅行の話に反応する。',bits:[['我','ngo5','私'],['都','dou1','〜も'],['想','soeng2','〜したい'],['去北海道','heoi3 bak1 hoi2 dou6','北海道へ行く']],q:'「想去」はどんな気持ち？',opts:['行ったことがない','行きたい','行きたくない'],a:1,note:'想（soeng2）は「〜したい」。都（dou1）で「私も」。'}
];
const KEY='dailychunks.cantonese.v1';
let storageOK=true;let state={cards:{}};try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');if(stored&&typeof stored.cards==='object'&&stored.cards)state=stored;}catch(e){storageOK=false;}
let screen='today',selectedId=null,showRoman=false,showJapanese=false,part=-1,answer=null,revealReview=false,reviewId=null,manualReview=false,searchQuery='',voiceState='checking';
const el=document.getElementById('app');
function safe(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function addDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return localDate(d);}
function card(id){return state.cards[id]||null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
function countLearned(){return lessons.filter(l=>!!card(l.id)).length;}
function dueItems(){return lessons.filter(l=>card(l.id)&&card(l.id).due<=localDate(new Date()));}
function recommended(){return dueItems()[0]||lessons.find(l=>!card(l.id))||lessons[0];}
function drawStats(){document.getElementById('stats').innerHTML='<div class="stat"><strong>'+countLearned()+'<small>/'+lessons.length+'</small></strong><span>学んだ表現</span></div><div class="stat"><strong>'+dueItems().length+'</strong><span>今日の復習</span></div>';}
function navActive(){document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function header(label,title,desc){return '<div class="eyebrow">'+safe(label)+'</div><h2 class="panel-title">'+safe(title)+'</h2><p class="muted">'+safe(desc)+'</p>';}
function renderHome(){const l=recommended();const due=dueItems().length;return '<section class="panel fade">'+header('TODAY · あなたの次の一歩',due?'今日は復習から':'今日の1フレーズ',due?'忘れかけている言葉を、もう一度。':'1つだけ覚えて、明日もう一度。')+'<div class="hr"></div><div class="sectionline"><span class="eyebrow">'+(due?'REVIEW DUE':'SPEAK IN CANTONESE')+'</span><span class="pill">約2分</span></div><div class="main-cn" lang="yue-Hant-HK">'+safe(l.cn)+'</div><p class="muted">'+safe(l.context)+'</p><div style="height:25px"></div><button class="primary" data-action="'+(due?'review-due':'open')+'" data-id="'+l.id+'"><span>'+(due?'復習を始める':'このフレーズを学ぶ')+'</span><span aria-hidden="true">→</span></button></section><section class="panel fade" aria-label="学び方">'+header('CHOOSE YOUR WAY','ほかにも、できること','すぐ学ぶか、これまでの表現を見返すか。')+'<div class="intro-flow"><button class="mini-card" data-nav="phrases" style="text-align:left;background:#fff"><span>▤ フレーズ集</span><strong>ほかの言葉を見る →</strong><span>旅行に使う8フレーズ</span></button><button class="mini-card" data-nav="review" style="text-align:left;background:#fff"><span>↻ 学び直す</span><strong>復習を開く →</strong><span>翌日以降に再確認</span></button></div></section>'+(storageOK?'':'<p class="flash">このブラウザでは学習履歴を保存できません。プライベートモードなどの設定を確認してください。</p>');}
function renderLesson(){const l=lessons.find(x=>x.id===selectedId)||recommended();const saved=card(l.id);const buttons='<div class="quick-actions"><button class="secondary" data-action="roman" aria-pressed="'+showRoman+'">'+(showRoman?'✓ 読み方を隠す':'Aa 読み方を見る')+'</button><button class="secondary" data-action="japanese" aria-pressed="'+showJapanese+'">'+(showJapanese?'✓ 意味を隠す':'文 意味を見る')+'</button></div>';const bits=l.bits.map((b,i)=>'<button class="chunk-btn" data-action="part" data-index="'+i+'" aria-pressed="'+(part===i)+'"><span class="characters" lang="yue-Hant-HK">'+safe(b[0])+'</span>'+(showRoman?'<span class="roman">'+safe(b[1])+'</span>':'')+'</button>').join('');const explain=part>=0?'<div class="chunk-explain"><b>'+safe(l.bits[part][0])+' · '+safe(l.bits[part][1])+'</b>'+safe(l.bits[part][2])+'<div><button class="mode-link" data-action="audio-part" data-index="'+part+'">▷ この部分だけ聞く</button></div></div>':'';const audio='<div class="audio-row"><button class="secondary" data-action="audio" aria-label="全文の広東語発音を聞く">▷ 全文を聞く</button><button class="secondary" data-action="audio-slow" aria-label="全文をゆっくり聞く">◴ ゆっくり聞く</button></div><p class="status" role="status" id="voiceStatus">'+voiceHint()+'</p>';const q=answer===null?'<div class="stack">'+l.opts.map((o,i)=>'<button class="option" data-action="answer" data-index="'+i+'">'+safe(o)+'</button>').join('')+'</div>':'<div class="stack">'+l.opts.map((o,i)=>'<div class="option '+(i===l.a?'correct':i===answer?'wrong':'')+'">'+safe(o)+(i===l.a?' ✓':'')+'</div>').join('')+'</div><div class="feedback '+(answer!==l.a?'error':'')+'">'+(answer===l.a?'正解！':'確認しよう。')+' '+safe(l.note)+'</div>';
return '<section class="panel fade"><div class="sectionline"><span class="eyebrow">LEARN · PHRASE '+String(lessons.indexOf(l)+1).padStart(2,'0')+'</span><button class="mode-link" data-nav="phrases">一覧へ戻る ↗</button></div><div class="main-cn" lang="yue-Hant-HK">'+safe(l.cn)+'</div><p class="muted">'+safe(l.context)+'</p>'+buttons+(showRoman?'<div class="big-phonetic"><div class="eyebrow" style="margin-bottom:5px">JYUTPING · 粤拼</div>'+safe(l.py)+'</div>':'')+(showJapanese?'<div class="translation" style="margin-top:9px">'+safe(l.ja)+'</div>':'')+audio+'<div class="hr"></div><div class="sectionline"><div class="detail-title">意味のまとまりをタップ</div><span class="eyebrow">'+l.bits.length+' parts</span></div><div class="chunk-grid">'+bits+'</div>'+explain+'<div class="hr"></div><div class="eyebrow">CHECK · 思い出す</div><h3 class="panel-title" style="font-size:18px">'+safe(l.q)+'</h3>'+q+(answer===null?'':answer===l.a?'<div style="margin-top:18px"><button class="primary" data-action="complete"><span>'+(saved?'復習を終える':'覚えた！ 翌日復習に追加')+'</span><span>→</span></button></div>':'<button class="secondary" style="width:100%;margin-top:8px" data-action="retry">もう一度答える</button>')+'</section>';}
function renderPhrases(){const filtered=lessons.filter(l=>(l.cn+' '+l.py+' '+l.ja+' '+l.context).toLowerCase().includes(searchQuery.toLowerCase()));return '<section class="panel fade">'+header('LIBRARY · 8 PHRASES','使う言葉を選ぶ','香港への帰省や、日本旅行の話から練習。')+'<div style="margin-top:19px"><label class="eyebrow" for="phraseSearch">フレーズを検索</label><input class="search" id="phraseSearch" type="search" placeholder="日本語・広東語・読み方" value="'+safe(searchQuery)+'" autocomplete="off"></div><div class="cardlist" id="phraseList">'+(filtered.length?filtered.map(l=>'<button class="listbutton" data-action="open" data-id="'+l.id+'"><span><strong lang="yue-Hant-HK">'+safe(l.cn)+'</strong><small>'+safe(l.ja)+'</small></span><span class="list-side">'+(card(l.id)?'✓ 学習済み':'学ぶ →')+'</span></button>').join(''):'<div class="empty"><p>一致するフレーズがありません。</p></div>')+'</div></section>';}
function renderReview(){const due=dueItems();const learned=lessons.filter(l=>!!card(l.id));if(reviewId)return renderReviewCard(lessons.find(l=>l.id===reviewId));if(!learned.length)return '<section class="panel fade">'+header('RECALL · REVIEW','復習は、学んだ翌日から','最初のフレーズを学ぶと、ここに復習がたまっていく。')+'<div class="empty"><div class="empty-icon">↻</div><p class="muted">まだ学習した表現がありません。</p></div><button class="primary" data-nav="today">今日の学習へ <span>→</span></button></section>';return '<section class="panel fade">'+header('RECALL · REVIEW','言葉を思い出す','答えを見る前に、日本語から広東語を思い浮かべよう。')+'<div class="hr"></div><div class="sectionline"><strong>'+(due.length?'今日の復習 '+due.length+'件':'今日の復習は完了')+'</strong><span class="pill">'+learned.length+'フレーズ学習済み</span></div>'+(due.length?due.map(l=>'<div class="review-card"><div class="review-label">'+safe(l.ja)+'</div><button class="mode-link" data-action="review-open" data-id="'+l.id+'">この言葉を思い出す →</button></div>').join(''):'<div class="empty"><div class="empty-icon">✓</div><p class="muted">今日の復習はありません。次の復習日は下で確認できます。</p></div>')+'<div class="hr"></div><div class="detail-title">学んだフレーズ</div>'+learned.map(l=>'<div class="review-card"><div class="sectionline"><span class="review-label">'+safe(l.ja)+'</span><span class="eyebrow">'+card(l.id).due+'</span></div><button class="mode-link" data-action="review-early" data-id="'+l.id+'">任意で今すぐ練習 →</button></div>').join('')+'</section>';}
function renderReviewCard(l){if(!l)return '';return '<section class="panel fade"><button class="mode-link" data-action="review-back">← 復習一覧に戻る</button><div class="eyebrow" style="margin-top:15px">RECALL · 答えを見る前に</div><h2 class="panel-title" style="font-size:26px">'+safe(l.ja)+'</h2><p class="muted">これを広東語で言える？ まず口に出してから答えを表示。</p>'+(revealReview?'<div class="hr"></div><div class="main-cn" lang="yue-Hant-HK">'+safe(l.cn)+'</div><div class="big-phonetic">'+safe(l.py)+'</div><p class="muted" style="margin-top:12px">'+safe(l.note)+'</p><button class="mode-link" data-action="audio-review">▷ 発音を確認する</button><p class="status" role="status" id="voiceStatus">'+voiceHint()+'</p><div class="review-cta"><button class="secondary" data-action="review-rate" data-rating="hard">まだ曖昧</button><button class="primary" data-action="review-rate" data-rating="easy">思い出せた ✓</button></div>':'<div style="margin-top:22px"><button class="primary" data-action="review-reveal">答えを確認する <span>→</span></button></div>')+'<p class="footnote">'+(manualReview?'予定日前の練習では、次回復習日を繰り上げません。':'思い出せなかった言葉は、翌日また出題します。')+'</p></section>';}
function voice(){if(!('speechSynthesis' in window))return null;const voices=window.speechSynthesis.getVoices();return voices.find(v=>/^yue(?:[-_]|$)/i.test(v.lang))||voices.find(v=>/^zh[-_]HK$/i.test(v.lang))||null;}
function voiceHint(){return voiceState==='speaking'?'端末の香港広東語音声で再生中。':voice()?'端末の香港広東語音声を利用します。正確な声調はネイティブ音声で確認してください。':'この端末では香港広東語の音声を確認できません。誤って普通話の音声を流さないため、再生しません。';}
function speak(text,slow){if(!('speechSynthesis' in window)){voiceState='missing';updateVoiceHint();return;}const v=voice();if(!v){voiceState='missing';updateVoiceHint();return;}try{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.voice=v;utterance.lang=v.lang;utterance.rate=slow?.72:.92;utterance.onstart=()=>{voiceState='speaking';updateVoiceHint();};utterance.onend=()=>{voiceState='ready';updateVoiceHint();};utterance.onerror=()=>{voiceState='error';const e=document.getElementById('voiceStatus');if(e)e.textContent='音声の再生に失敗しました。端末の設定をご確認ください。';};speechSynthesis.speak(utterance);}catch(e){voiceState='error';const p=document.getElementById('voiceStatus');if(p)p.textContent='音声の再生に失敗しました。';}}
function updateVoiceHint(){const p=document.getElementById('voiceStatus');if(p)p.textContent=voiceHint();}
function render(keepScroll){const oldY=window.scrollY;document.body.classList.toggle('compact-lesson',screen!=='today');drawStats();navActive();if(screen==='today')el.innerHTML=renderHome();if(screen==='learn')el.innerHTML=renderLesson();if(screen==='phrases')el.innerHTML=renderPhrases();if(screen==='review')el.innerHTML=renderReview();document.title=(screen==='learn'?'学ぶ':screen==='phrases'?'フレーズ':screen==='review'?'復習':'今日')+' — Cantonese Chunks';if(keepScroll)window.scrollTo({top:oldY,behavior:'instant'});else window.scrollTo({top:0,behavior:'instant'});}
function go(next){if('speechSynthesis' in window)speechSynthesis.cancel();screen=next;reviewId=null;render();}
function learn(id){selectedId=id;showRoman=false;showJapanese=false;part=-1;answer=null;screen='learn';render();}
function complete(){const l=lessons.find(x=>x.id===selectedId);if(!l||answer!==l.a)return;const old=card(l.id);state.cards[l.id]={stage:old?old.stage:0,due:old?old.due:addDays(1),lastSeen:localDate(new Date())};save();screen='today';render();const banner=document.createElement('div');banner.className='flash';banner.setAttribute('role','status');banner.textContent=old?'復習できた！ 学んだ表現は引き続き復習一覧に残ります。':'学習完了！ 最初の復習は明日。';el.prepend(banner);}
function rate(rating){const l=lessons.find(x=>x.id===reviewId);if(!l)return;const old=card(l.id);if(!old)return;const isDue=old.due<=localDate(new Date());if(isDue){const nextStage=rating==='easy'?Math.min(3,(old.stage||0)+1):0;const delays=[1,3,7,14];state.cards[l.id]={...old,stage:nextStage,due:addDays(delays[nextStage]),lastSeen:localDate(new Date())};save();}reviewId=null;manualReview=false;revealReview=false;render();const banner=document.createElement('div');banner.className='flash';banner.setAttribute('role','status');banner.textContent=isDue?(rating==='easy'?'思い出せた！ 次の復習日を更新したで。':'次は明日、もう一度確認しよう。'):'練習完了。次の復習予定日はそのまま。';el.prepend(banner);}
document.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav);return;}const action=b.dataset.action;if(!action)return;if(action==='open'){learn(b.dataset.id);return;}if(action==='review-due'){screen='review';reviewId=b.dataset.id;manualReview=false;revealReview=false;render();return;}if(action==='roman'){showRoman=!showRoman;render(true);return;}if(action==='japanese'){showJapanese=!showJapanese;render(true);return;}if(action==='part'){part=part===Number(b.dataset.index)?-1:Number(b.dataset.index);render(true);return;}if(action==='audio'||action==='audio-slow'){const l=lessons.find(x=>x.id===selectedId);if(l)speak(l.cn,action==='audio-slow');return;}if(action==='audio-part'){const l=lessons.find(x=>x.id===selectedId);if(l&&l.bits[Number(b.dataset.index)])speak(l.bits[Number(b.dataset.index)][0],false);return;}if(action==='answer'){answer=Number(b.dataset.index);render(true);return;}if(action==='retry'){answer=null;render(true);return;}if(action==='complete'){complete();return;}if(action==='review-open'||action==='review-early'){reviewId=b.dataset.id;manualReview=action==='review-early';revealReview=false;render();return;}if(action==='review-back'){reviewId=null;render();return;}if(action==='review-reveal'){revealReview=true;render(true);return;}if(action==='audio-review'){const l=lessons.find(x=>x.id===reviewId);if(l)speak(l.cn,false);return;}if(action==='review-rate'){rate(b.dataset.rating);return;}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='phraseSearch'){searchQuery=e.target.value;const list=document.getElementById('phraseList');if(!list)return;const filtered=lessons.filter(l=>(l.cn+' '+l.py+' '+l.ja+' '+l.context).toLowerCase().includes(searchQuery.toLowerCase()));list.innerHTML=filtered.map(l=>'<button class="listbutton" data-action="open" data-id="'+l.id+'"><span><strong>'+safe(l.cn)+'</strong><small>'+safe(l.ja)+'</small></span><span class="list-side">'+(card(l.id)?'✓ 学習済み':'学ぶ →')+'</span></button>').join('')||'<div class="empty"><p>一致するフレーズがありません。</p></div>';}});
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=updateVoiceHint;}
render();
})();
</script>
</body>
</html>
