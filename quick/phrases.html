<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152b51"><title>フレーズ練習 | Quick Lab</title>
<style>:root{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;color:#1b2a43;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:16px 16px 64px}a{color:#315ba2}header{display:flex;align-items:center;justify-content:space-between}header a{font-size:14px}h1{font-size:23px;margin:20px 0 6px}p{line-height:1.5}.muted{color:#617087;font-size:13px}.panel{border:1px solid #dce3ed;background:#fff;border-radius:18px;padding:18px;margin-top:16px}.phrase{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.char{font-size:48px;line-height:1.4;padding:5px 8px;border-bottom:4px solid transparent;font-family:"PingFang TC","Noto Serif CJK TC",serif}.char.active{border-color:#3166ba;background:#eff4ff;border-radius:8px}.char.done{color:#447c56}.progress{height:6px;background:#e6ebf3;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#3166ba}button,select{font:inherit;border:1px solid #cbd5e1;border-radius:11px;background:white;color:#192d50;min-height:44px;padding:10px 12px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #386bd0;outline-offset:3px}button.primary{background:#1e427e;color:white;border-color:#1e427e}button:disabled{opacity:.45;cursor:not-allowed}.keyboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.keyboard button{padding:8px 2px;min-height:48px;font-weight:700}.keyboard small{display:block;font-size:13px;font-weight:400;color:#65768e}.slots{display:flex;justify-content:center;gap:12px;margin:12px}.slot{min-width:64px;min-height:56px;border:2px solid #cbd5e1;border-radius:11px;display:grid;place-items:center;font-size:26px;font-weight:700}.actions{display:flex;gap:8px;margin:12px 0}.actions button{flex:1}.feedback{background:#eff4fb;border-radius:12px;padding:13px;margin:12px 0}.feedback p{margin:7px 0}.hidden{display:none!important}.desktop{display:none}#typing{width:100%;padding:12px;text-transform:uppercase;font-size:22px;text-align:center;letter-spacing:.2em;border:2px solid #cbd5e1;border-radius:12px}@media(min-width:700px){.desktop{display:block}.mobile{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><main>
<header><a href="./">← 単字クイズ</a><span class="muted">Quick Lab · Phrase</span></header><h1>フレーズを入力する</h1><p class="muted">意味のある言葉を、1文字ずつ速成コードで入力。文字を確定したら次へ進む。</p>
<label for="choose">練習するフレーズ</label><select id="choose" style="width:100%;margin-top:6px"></select>
<section class="panel" aria-label="フレーズ練習"><div style="display:flex;justify-content:space-between;gap:10px"><span class="muted" id="count">1 / 2文字</span><span class="muted" id="status" role="status">コードを入力</span></div><div class="progress" aria-label="フレーズの進捗"><div id="bar" style="width:0"></div></div><div class="phrase" id="phrase" aria-label="練習中のフレーズ"></div><p class="muted" style="text-align:center" id="meaning"></p><div class="slots" aria-label="入力コード"><div class="slot" id="slot0">·</div><div class="slot" id="slot1">·</div></div>
<div class="desktop"><label for="typing" class="muted">英字キーで入力（Enterで判定）</label><input id="typing" maxlength="2" autocomplete="off" spellcheck="false" autocapitalize="characters" inputmode="latin"></div>
<div class="mobile"><p class="muted" style="text-align:center">字根キーをタップ</p><div id="keyboard" class="keyboard"></div></div>
<div class="actions"><button id="erase">⌫ 消す</button><button id="hint">ヒント</button><button id="check" class="primary" disabled>答える</button></div><div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary hidden" style="width:100%">次の文字 →</button></section>
<p class="muted">倉頡第5代を基準にした学習用コード。実際のIMEでの候補選択は含みません。<a href="https://github.com/rime/rime-cangjie/blob/master/cangjie5.base.dict.yaml">出典：Rime 倉頡第5代コード表</a></p>
</main><script src="./data.js"></script><script>
"use strict";
const $=id=>document.getElementById(id);
const dict=new Map((window.QUICK_DATA||[]).map(x=>[x.han,x]));
const PHRASES=[{text:"早晨",meaning:"おはよう"},{text:"我愛你",meaning:"あなたが好きです／愛しています"},{text:"你好",meaning:"こんにちは"},{text:"多謝",meaning:"ありがとう"}];
const ROOTS={A:"日",B:"月",C:"金",D:"木",E:"水",F:"火",G:"土",H:"竹",I:"戈",J:"十",K:"大",L:"中",M:"一",N:"弓",O:"人",P:"心",Q:"手",R:"口",S:"尸",T:"廿",U:"山",V:"女",W:"田",Y:"卜"};
let phraseIndex=0,pos=0,typed="",done=false,helped=false,misses=0;
function active(){return dict.get([...PHRASES[phraseIndex].text][pos])}
function slots(){let q=active(),len=q?.code.length||2;for(let i=0;i<2;i++){let e=$("slot"+i);e.textContent=typed[i]||"·";e.classList.toggle("hidden",i>=len)}$("typing").value=typed;$("check").disabled=done||typed.length!==len;$("erase").disabled=done||!typed.length}
function render(){let p=PHRASES[phraseIndex],chars=[...p.text];$("phrase").innerHTML=chars.map((c,i)=>'<span class="char '+(i<pos?'done':i===pos?'active':'')+'" '+(i===pos?'aria-current="step"':'')+'>'+c+'</span>').join("");$("meaning").textContent=p.meaning;$("bar").style.width=Math.round(pos/chars.length*100)+"%";$("count").textContent=pos>=chars.length?"完了":(pos+1)+" / "+chars.length+"文字";$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("hint").disabled=pos>=chars.length;typed="";done=false;helped=false;$("status").textContent=pos>=chars.length?"完了":active().code.length+"キーで答える";if(pos>=chars.length){$("feedback").textContent="✓ フレーズ完成！ 間違えた回数："+misses;$("feedback").classList.remove("hidden");$("next").textContent="もう一度";$("next").classList.remove("hidden")}slots()}
function append(k){let q=active();if(!q||done||typed.length>=q.code.length)return;typed+=k;slots()}
function erase(){if(!done){typed=typed.slice(0,-1);slots()}}
function check(){let q=active();if(!q||done||typed.length!==q.code.length)return;done=true;let good=typed===q.code;if(!good)misses++;$("status").textContent=good?"正解":"復習しよう";$("feedback").innerHTML='<strong>'+(good?"✓ 正解":"正解："+q.code)+'</strong><p>'+q.han+'｜倉頡 '+q.cangjie+' → 速成 '+q.code+'</p><p>'+q.explain+'</p>';$("feedback").classList.remove("hidden");$("next").classList.remove("hidden");$("next").textContent=pos===[...PHRASES[phraseIndex].text].length-1?"フレーズを完成":"次の文字 →";$("hint").disabled=true;slots()}
function next(){if(pos>=[...PHRASES[phraseIndex].text].length){pos=0;misses=0;render();return}pos++;render()}
$("choose").innerHTML=PHRASES.map((p,i)=>'<option value="'+i+'">'+p.text+' — '+p.meaning+'</option>').join("");
$("choose").onchange=e=>{phraseIndex=Number(e.target.value);pos=0;misses=0;render()};
$("keyboard").innerHTML=Object.entries(ROOTS).map(([k,v])=>'<button type="button" data-key="'+k+'" aria-label="'+k+' '+v+'">'+k+'<small>'+v+'</small></button>').join("");
$("keyboard").addEventListener("click",e=>{let b=e.target.closest("[data-key]");if(b)append(b.dataset.key)});
$("erase").onclick=erase;$("check").onclick=check;$("next").onclick=next;
$("hint").onclick=()=>{let q=active();if(!q)return;helped=true;$("feedback").textContent="ヒント：最初の字根は "+q.code[0]+"（"+ROOTS[q.code[0]]+"）";$("feedback").classList.remove("hidden")};
$("typing").addEventListener("input",e=>{let q=active();if(q&&!done){typed=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,q.code.length);slots()}});
document.addEventListener("keydown",e=>{if(e.target===$("typing")){if(e.key==="Enter"){e.preventDefault();done?next():check()}return}if(e.altKey||e.metaKey||e.ctrlKey||["SELECT","BUTTON","A"].includes(e.target.tagName))return;if(e.key==="Enter"){done?next():check()}else if(e.key==="Backspace")erase();else if(/^[a-z]$/i.test(e.key))append(e.key.toUpperCase())});
for(const p of PHRASES)for(const c of [...p.text])if(!dict.has(c))throw Error("Unknown phrase character: "+c);
render();
</script></body></html>
