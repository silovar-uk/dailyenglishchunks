function home(){current=null;document.title="Korean Chunks — ハングルから";var next=lessons.find(function(x){return !done[x.id]})||lessons[0];var count=lessons.filter(function(x){return done[x.id]}).length;app.innerHTML='<div class="hero"><div><p class="eyebrow">KOREAN CHUNKS · STARTER</p><h1>韓国語を、<br>文字から読めるように。</h1><p class="lead">まずハングルの形、次に音の組み立て。少し読めるようになったら短い会話へ。ローマ字は補助として使い、最終的にはハングルだけで読めることを目指します。</p></div><div class="mark" aria-hidden="true">가</div></div><section><div class="sectiontop"><h2>まずはここから</h2><span class="small">'+count+'/'+lessons.length+' 修了</span></div><button class="feature" data-open="'+next.id+'" type="button"><span class="feature-top"><span class="small">LESSON '+next.id+' · '+next.label+'</span><span class="pill">'+(done[next.id]?"復習":"最初の一歩")+'</span></span><strong>'+esc(next.title)+'</strong><span class="desc">'+esc(next.description)+'</span><span class="small">◷ '+next.min+'分 · 🔊 音声とクイズつき</span><span class="cta"><span>'+(done[next.id]?"もう一度学ぶ":"このレッスンを始める")+'</span><span>→</span></span></button></section><section class="section"><div class="sectiontop"><h2>学習の道すじ</h2><span class="small">文字 → 音 → 会話</span></div><div class="items">'+lessons.map(function(x){return '<button type="button" class="item" data-open="'+x.id+'"><span class="num">'+(done[x.id]?"✓":x.id)+'</span><span><strong>'+esc(x.title)+'</strong><small>'+esc(x.description)+'</small></span><span>→</span></button>'}).join("")+'</div></section><div class="notice"><b>なぜカタカナをつけないの？</b><br>韓国語には、日本語にない母音や子音があります。カタカナだけで覚えると音の違いが見えなくなるため、最初はローマ字表記・音のコツ・読み上げを併用し、徐々に補助を減らしていきます。ローマ字も実際の音を完全には表しません。</div>';bind();window.scrollTo(0,0)}

if(l.kind==="d"&&step===1){h=piece("READ · そのまま見て聴く","3つの短い表現")+'<div class="panel">'+phrases.map(function(x){return '<div class="phrase"><div class="ko">'+x[0]+'</div><div class="small">'+x[2]+'</div><button class="audio" type="button" data-audio="'+x[0]+'">🔊 発音を聴く</button></div>'}).join("")+'</div>'}
if(l.kind==="d"&&step===2){h=piece("CHUNKS · 音のまとまり","音節で分けてみよう。")+'<div class="panel"><div class="ko">안 · 녕 · 하 · 세 · 요</div><div class="roman">annyeonghaseyo</div><p class="small">丁寧な「こんにちは」。文字は音節ごとに分けて読めても、実際の発音はつながります。</p><button class="audio" type="button" data-audio="안녕하세요">🔊 まとめて聴く</button></div><div class="panel"><strong>次に覚えること：パッチムと音の変化</strong><p class="small">「감사합니다」は、一字ずつのつづりだけでは自然な発音を再現できません。終声（パッチム）と音の変化は後の単元で学びます。</p></div>'}
if(l.kind==="d"&&step===3){h=piece("SPEAK · 会話する","意味 → 音 → 気持ち")+'<div class="panel">'+[phrases[0],phrases[1],phrases[2]].map(function(x){return '<div class="phrase"><div class="ko">'+x[0]+'</div><div class="small">'+x[2]+'</div><button class="audio" type="button" data-audio="'+x[0]+'">🔊 聴く</button></div>'}).join("")+'</div><p class="small">まずゆっくり1回、流れを意識して1回、相手に話すつもりで1回声に出しましょう。</p>'}
if(step===4){var q=(l.kind==='x'?l.quiz:questions[l.kind])[question];h=piece("CHECK · 理解度", "3問で確認する")+'<p class="small">問題 '+(question+1)+' / 3</p><div class="panel"><h3>'+esc(q[0])+'</h3><div class="options">'+q[1].map(function(o,i){return '<button type="button" class="option '+(selected!==null?(i===q[2]?"correct":i===selected?"wrong":""):"")+'" data-option="'+i+'" '+(selected!==null?"disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>'+(selected!==null?'<div class="feedback '+(selected===q[2]?"":"wrong")+'"><b>'+(selected===q[2]?"正解！":"もう一度確認")+'</b><br>'+esc(q[3])+'</div>':"")+'</div>'}
if(last){done[l.id]=true;save();h='<div class="checkmark">✓</div>'+piece("COMPLETE · おつかれさま！","自分で読む一歩ができた。")+'<p>文字の数を増やすより、今日読んだものを明日も思い出せることが大事です。</p><div class="panel"><div class="ko">'+(l.kind==="v"?"아 · 어 · 오 · 우":l.kind==="c"?"나 · 마 · 가":"안녕하세요.")+'</div><p class="small">ローマ字を見ずに声に出してみよう。</p></div>'}

/* Data-driven Korean mini-lessons, preserving the original 01–03 flow. */
if(l.kind==="x"&&step===0){
 h=piece("IMAGINE · 今日のゴール",esc(l.goal))+'<div class="panel"><p>'+esc(l.intro)+'</p><p class="small"><b>復習：</b>'+esc(l.review)+'</p></div>';
}
if(l.kind==="x"&&step===1){
 h=piece(l.reviewOnly?"REVIEW · 文字と音の復習":"LETTER · 今日の新しい文字",l.reviewOnly?"新しい文字は増やさず、違いを確かめよう。":"新しい音は、まず1つだけ。")+'<p class="small">文字を見て口の形を確かめてから、音を聴こう。</p><div class="panel">'+l.letters.map(function(x){
 return '<div class="phrase"><div class="ko">'+esc(x.char)+'</div><div class="roman">'+esc(x.roman)+'</div><p class="small">'+esc(x.tip)+'</p><button type="button" class="audio" data-audio="'+esc(x.audio)+'">🔊 この音を聴く</button></div>';
 }).join("")+'</div><p class="small">ローマ字は最初の補助。韓国語の発音を完全には表せません。</p>';
}
if(l.kind==="x"&&step===2){
 h=piece("BUILD · 組み立てる","読める文字をつないでみよう。")+'<p class="small">左側の文字を順番に読んでから、完成した音節・単語を聴こう。</p><div class="panel">'+l.builds.map(function(x){
 return '<div class="phrase"><div class="builder"><span style="font-size:1.5rem">'+x.parts.map(esc).join(" + ")+'</span><span>→</span><output>'+esc(x.result)+'<small>'+esc(x.roman)+'</small></output></div><p class="small">'+esc(x.tip)+'</p><button type="button" class="audio" data-audio="'+esc(x.result)+'">🔊 音を聴く</button></div>';
 }).join("")+'</div>';
}
if(l.kind==="x"&&step===3){
 h=piece("READ · 自分で読んでみる","ローマ字を隠して読める？")+'<div class="row"><p class="small">先に自分で読み、タップして音を確かめよう。</p><button class="toggle" data-guide type="button">ローマ字を'+(guide?"隠す":"表示")+'</button></div><div class="panel"><div class="samples">'+l.reads.map(function(x){
 return '<button type="button" class="sample" data-audio="'+esc(x.ko)+'"><strong>'+esc(x.ko)+'</strong><span>'+(guide?esc(x.roman):"自力で読む")+'</span><small>'+esc(x.ja)+'</small></button>';
 }).join("")+'</div></div><p class="small"><b>声に出す：</b>'+esc(l.speak)+'</p>';
}
if(l.kind==="x"&&step===5){
 h='<div class="checkmark">✓</div>'+piece("COMPLETE · 今日のまとめ","新しい1文字が、単語になった。")+'<div class="panel"><div class="ko">'+esc(l.final)+'</div><p class="small">'+esc(l.speak)+'</p><p class="small">'+esc(l.review)+'</p></div>';
}

var label=step===4?(selected===null?"答えを選んでください":question===2?"学習を完了":"次の問題へ"):step===5?"一覧へ戻る":"次に進む";
app.innerHTML='<div class="lesson-head"><button class="back" type="button" data-home>← 一覧に戻る</button><span class="small">LESSON '+l.id+' · '+(step+1)+'/6</span></div><div class="progress"><div style="width:'+Math.round((step+1)/6*100)+'%"></div></div><p class="eyebrow">'+l.label+' · '+l.min+' MIN</p><h1>'+esc(l.title)+'</h1>'+h+'<p class="small" id="audio-status" role="status" aria-live="polite"></p><div class="nav">'+(step>0?'<button type="button" class="prev" data-prev>戻る</button>':"")+'<button type="button" class="next" data-next '+(step===4&&selected===null?"disabled":"")+'>'+label+'</button></div>';
bind();window.scrollTo(0,0)}
function bind(){
app.querySelectorAll("[data-open]").forEach(function(b){b.addEventListener("click",function(){open(b.dataset.open)})});
app.querySelectorAll("[data-home]").forEach(function(b){b.addEventListener("click",home)});
app.querySelectorAll("[data-next]").forEach(function(b){b.addEventListener("click",function(){if(step===4){if(selected===null)return;if(question<2){question++;selected=null;draw();return}}if(step===5){home();return}step++;selected=null;draw()})});
app.querySelectorAll("[data-prev]").forEach(function(b){b.addEventListener("click",function(){if(step===4&&question>0){question--;selected=null}else{step=Math.max(0,step-1);question=0;selected=null}draw()})});
app.querySelectorAll("[data-letter]").forEach(function(b){b.addEventListener("click",function(){var arr=current.kind==="v"?vowels:consonants;var x=arr.find(function(o){return o[0]===b.dataset.letter});if(!x)return;app.querySelectorAll("[data-letter]").forEach(function(t){t.classList.toggle("selected",t===b)});var p=document.getElementById("letter-detail");p.innerHTML='<div class="row"><strong class="ko">'+x[0]+'</strong><button class="audio" type="button" id="letter-play">🔊 聴く</button></div><p>'+esc(x[2])+'</p>';document.getElementById("letter-play").addEventListener("click",function(){speech(current.kind==="v"?syll("ㅇ",x[0]):syll(x[0],"ㅏ"))})})});
app.querySelectorAll("[data-build]").forEach(function(b){b.addEventListener("click",function(){if(current.kind==="v")cv=b.dataset.build;else cc=b.dataset.build;draw()})});
app.querySelectorAll("[data-guide]").forEach(function(b){b.addEventListener("click",function(){guide=!guide;draw()})});
app.querySelectorAll("[data-audio]").forEach(function(b){b.addEventListener("click",function(){speech(b.dataset.audio)})});
app.querySelectorAll("[data-option]").forEach(function(b){b.addEventListener("click",function(){if(selected!==null)return;selected=Number(b.dataset.option);draw()})});
}
document.getElementById("home").addEventListener("click",home);home();
})();
</script>
