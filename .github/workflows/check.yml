name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check bootstrap.js
          node --check lessons.js
          for file in lesson-*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
