<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152b51"><title>フレーズ練習 | Quick Lab</title>
<style>:root{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;color:#1b2a43;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:16px 16px 64px}a{color:#315ba2}header{display:flex;align-items:center;justify-content:space-between}header a{font-size:14px}h1{font-size:23px;margin:20px 0 6px}p{line-height:1.5}.muted{color:#617087;font-size:13px}.panel{border:1px solid #dce3ed;background:#fff;border-radius:18px;padding:18px;margin-top:16px}.phrase{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.char{font-size:48px;line-height:1.4;padding:5px 8px;border-bottom:4px solid transparent;font-family:"PingFang TC","Noto Serif CJK TC",serif}.char.active{border-color:#3166ba;background:#eff4ff;border-radius:8px}.char.done{color:#447c56}.progress{height:6px;background:#e6ebf3;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#3166ba}button,select{font:inherit;border:1px solid #cbd5e1;border-radius:11px;background:white;color:#192d50;min-height:44px;padding:10px 12px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #386bd0;outline-offset:3px}button.primary{background:#1e427e;color:white;border-color:#1e427e}button:disabled{opacity:.45;cursor:not-allowed}.keyboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.keyboard button{padding:8px 2px;min-height:48px;font-weight:700}.keyboard small{display:block;font-size:13px;font-weight:400;color:#65768e}.slots{display:flex;justify-content:center;gap:12px;margin:12px}.slot{min-width:64px;min-height:56px;border:2px solid #cbd5e1;border-radius:11px;display:grid;place-items:center;font-size:26px;font-weight:700}.actions{display:flex;gap:8px;margin:12px 0}.actions button{flex:1}.feedback{background:#eff4fb;border-radius:12px;padding:13px;margin:12px 0}.feedback p{margin:7px 0}.hidden{display:none!important}.desktop{display:none}#typing{width:100%;padding:12px;text-transform:uppercase;font-size:22px;text-align:center;letter-spacing:.2em;border:2px solid #cbd5e1;border-radius:12px}@media(min-width:700px){.desktop{display:block}.mobile{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style><link rel="stylesheet" href="./phrase-vocab.css?v=lexicon55-01"></head><body><main>
<header><a href="./">← 単字クイズ</a><span class="muted">Quick Lab · Phrase</span></header><h1>フレーズを入力する</h1><p class="muted">意味のある言葉を、1文字ずつ速成コードで入力。文字を確定したら次へ進む。</p>
<section class="catalog-finder" aria-label="頻出表現を探す">
  <label for="phraseSearch">使いたい広東語を探す</label>
  <input id="phraseSearch" type="search" autocomplete="off" placeholder="漢字・日本語・粤拼で検索" aria-controls="choose">
  <div class="catalog-filter-row">
    <label for="phraseCategory">場面</label>
    <select id="phraseCategory" aria-label="場面で絞り込み"></select>
    <span id="filterCount" role="status" aria-live="polite">55表現</span>
  </div>
  <label for="choose">練習する表現を選択</label>
  <select id="choose" aria-label="練習する表現"></select>
</section>
<section class="panel" aria-label="フレーズ練習"><div style="display:flex;justify-content:space-between;gap:10px"><span class="muted" id="count">1 / 2文字</span><span class="muted" id="status" role="status">コードを入力</span></div><div class="progress" role="progressbar" aria-label="フレーズの進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div id="bar" style="width:0"></div></div><div class="phrase" id="phrase" aria-label="練習中のフレーズ"></div><p class="muted" style="text-align:center" id="meaning"></p><p class="muted hidden" style="text-align:center;font-size:11px" id="phraseNote"></p>
<div class="phrase-audio"><button id="listenPhrase" type="button" aria-label="この表現を広東語で読み上げる">▶ 発音を聞く</button><span id="phraseReading" lang="yue-Latn"></span></div>
<p id="audioStatus" class="audio-status" role="status" aria-live="polite"></p>
<div class="slots" aria-label="入力コード" role="group"><div class="slot" id="slot0">·</div><div class="slot" id="slot1">·</div></div>
<div class="desktop"><label for="typing" class="muted">英字キーで入力（Enterで判定）</label><input id="typing" maxlength="2" autocomplete="off" spellcheck="false" autocapitalize="characters" inputmode="latin"></div>
<div class="mobile"><p class="muted" style="text-align:center">字根キーをタップ</p><div id="keyboard" class="keyboard"></div></div>
<div class="actions"><button id="erase">⌫ 消す</button><button id="hint">ヒント</button><button id="check" class="primary" disabled>答える</button></div><div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary hidden" style="width:100%">次の文字 →</button></section>
<p class="muted">倉頡第5代を基準にした学習用コード。実際のIMEでの候補選択は含みません。<a href="https://github.com/rime/rime-cangjie/blob/master/cangjie5.base.dict.yaml">出典：Rime 倉頡第5代コード表</a></p>
</main><script src="./data.js?v=frequency150-v1"></script><script src="./lexicon/core.js?v=lexicon55-01"></script><script src="./lexicon/search.js?v=lexicon55-01"></script><script src="./speech.js?v=speech-replay-01"></script><script>
"use strict";
const $=id=>document.getElementById(id);
const dict=new Map((window.QUICK_DATA||[]).map(x=>[x.han,x]));
const PHRASES=window.QUICK_LEXICON_CORE||[];
if(PHRASES.length!==55)throw Error("Practical phrase catalog unavailable");
const ROOTS={A:"日",B:"月",C:"金",D:"木",E:"水",F:"火",G:"土",H:"竹",I:"戈",J:"十",K:"大",L:"中",M:"一",N:"弓",O:"人",P:"心",Q:"手",R:"口",S:"尸",T:"廿",U:"山",V:"女",W:"田",Y:"卜"};
const phraseParam=new URLSearchParams(window.location.search).get("phrase");
let phraseIndex=Math.max(0,PHRASES.findIndex(p=>p.text===phraseParam)),pos=0,typed="",done=false,helped=false,misses=0;
function active(){return dict.get([...PHRASES[phraseIndex].text][pos])}
function slots(){let q=active(),len=q?.code.length||2;for(let i=0;i<2;i++){let e=$("slot"+i);e.textContent=typed[i]||"·";e.classList.toggle("hidden",i>=len)}$("typing").value=typed;$("check").disabled=done||typed.length!==len;$("erase").disabled=done||!typed.length}
function render(){let p=PHRASES[phraseIndex],chars=[...p.text];$("phrase").innerHTML=chars.map((c,i)=>'<span class="char '+(i<pos?'done':i===pos?'active':'')+'" '+(i===pos?'aria-current="step"':'')+'>'+c+'</span>').join("");$("meaning").textContent=p.meaning;$("phraseReading").textContent=p.jyutping;$("listenPhrase").setAttribute("aria-label",p.text+"の広東語発音を聞く");$("phraseNote").textContent=p.note||"";$("phraseNote").classList.toggle("hidden",!p.note);$("bar").style.width=Math.round(pos/chars.length*100)+"%";$("progressTrack").setAttribute("aria-valuenow",String(Math.round(pos/chars.length*100)));$("count").textContent=pos>=chars.length?"完了":(pos+1)+" / "+chars.length+"文字";$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("hint").disabled=pos>=chars.length;typed="";done=false;helped=false;$("status").textContent=pos>=chars.length?"完了":active().code.length+"キーで答える";if(pos>=chars.length){$("feedback").textContent="✓ フレーズ完成！ 間違えた回数："+misses;$("feedback").classList.remove("hidden");$("next").textContent="もう一度";$("next").classList.remove("hidden")}slots()}
function append(k){let q=active();if(!q||done||typed.length>=q.code.length)return;typed+=k;slots()}
function erase(){if(!done){typed=typed.slice(0,-1);slots()}}
function check(){let q=active();if(!q||done||typed.length!==q.code.length)return;done=true;let good=typed===q.code;if(!good)misses++;$("status").textContent=good?"正解":"復習しよう";$("feedback").innerHTML='<strong>'+(good?"✓ 正解":"正解："+q.code)+'</strong><p>'+q.han+'｜倉頡 '+q.cangjie+' → 速成 '+q.code+'</p><p>'+q.explain+'</p>';$("feedback").classList.remove("hidden");$("next").classList.remove("hidden");$("next").textContent=pos===[...PHRASES[phraseIndex].text].length-1?"フレーズを完成":"次の文字 →";$("hint").disabled=true;slots()}
function next(){if(pos>=[...PHRASES[phraseIndex].text].length){pos=0;misses=0;render();return}pos++;render()}
// Search never changes the current question: only explicitly choosing a result does.
const sceneFilter=$("phraseCategory");
for(const [id,label] of Object.entries(window.QuickLexiconSearch.categories)){
  const option=document.createElement("option");
  option.value=id;option.textContent=label;
  sceneFilter.append(option);
}
function refreshPhraseOptions(){
  const query=$("phraseSearch").value;
  const category=sceneFilter.value||"all";
  const results=window.QuickLexiconSearch.filter(PHRASES,{query,category});
  const selected=PHRASES[phraseIndex];
  const options=[];
  if(!results.includes(selected)){
    const pinned=document.createElement("option");
    pinned.value=String(phraseIndex);
    pinned.textContent="練習中： "+selected.text+"（検索対象外）";
    options.push(pinned);
  }
  for(const item of results){
    const option=document.createElement("option");
    option.value=String(PHRASES.indexOf(item));
    option.textContent=item.text+" — "+item.meaning;
    options.push(option);
  }
  $("choose").replaceChildren(...options);
  $("choose").value=String(phraseIndex);
  $("filterCount").textContent=results.length+" / "+PHRASES.length+"表現";
}
function choosePhrase(index){
  if(!Number.isInteger(index)||index<0||index>=PHRASES.length)return;
  window.QuickSpeech?.stop?.();
  $("audioStatus").textContent="";
  phraseIndex=index;pos=0;misses=0;
  render();
  refreshPhraseOptions();
}
$("phraseSearch").addEventListener("input",refreshPhraseOptions);
sceneFilter.addEventListener("change",refreshPhraseOptions);
$("choose").onchange=e=>choosePhrase(Number(e.target.value));
$("listenPhrase").onclick=()=>{
  const phrase=PHRASES[phraseIndex];
  if(!window.QuickSpeech){
    $("audioStatus").textContent="読み上げ機能を読み込めませんでした";
    return;
  }
  window.QuickSpeech.play(phrase.text,({phase,voiceKnown,error})=>{
    if(phase==="requested")$("audioStatus").textContent="▶ 発音を準備中…";
    if(phase==="speaking")$("audioStatus").textContent=voiceKnown?"▶ 再生中":"▶ 再生中（香港広東語の音声か確認してください）";
    if(phase==="ended")$("audioStatus").textContent=voiceKnown?"✓ 再生完了":"音声が終わりました。端末の広東語音声設定も確認してください";
    if(phase==="unsupported")$("audioStatus").textContent="この端末では読み上げに対応していません";
    if(phase==="error")$("audioStatus").textContent="再生できませんでした（"+(error||"不明")+"）";
  });
};
refreshPhraseOptions();
$("keyboard").innerHTML=Object.entries(ROOTS).map(([k,v])=>'<button type="button" data-key="'+k+'" aria-label="'+k+' '+v+'">'+k+'<small>'+v+'</small></button>').join("");
$("keyboard").addEventListener("click",e=>{let b=e.target.closest("[data-key]");if(b)append(b.dataset.key)});
$("erase").onclick=erase;$("check").onclick=check;$("next").onclick=next;
$("hint").onclick=()=>{let q=active();if(!q)return;helped=true;$("feedback").textContent="ヒント：最初の字根は "+q.code[0]+"（"+ROOTS[q.code[0]]+"）";$("feedback").classList.remove("hidden")};
$("typing").addEventListener("input",e=>{let q=active();if(q&&!done){typed=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,q.code.length);slots()}});
document.addEventListener("keydown",e=>{if(e.target===$("typing")){if(e.key==="Enter"){e.preventDefault();done?next():check()}return}if(e.target&&["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;if(e.altKey||e.metaKey||e.ctrlKey||["BUTTON","A"].includes(e.target?.tagName))return;if(e.key==="Enter"){done?next():check()}else if(e.key==="Backspace")erase();else if(/^[a-z]$/i.test(e.key))append(e.key.toUpperCase())});
for(const p of PHRASES)for(const c of [...p.text])if(!dict.has(c))throw Error("Unknown phrase character: "+c);
render();
</script></body></html>
